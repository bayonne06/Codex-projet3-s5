<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | NEON PULSE</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Hanken+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">NEON PULSE</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="team.html">Team</a></li>
        <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
        <li class="btn-nav"><a href="contact.html">Get Started</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="team-section" style="padding: 120px 40px; text-align:center;">
      <h1 class="team-section__title">Contactez-nous</h1>
      <p class="team-section__subtitle">Prêt à lancer votre projet neon ? Écrivez-nous.</p>
    </section>

    <section class="team-section" style="padding-bottom: 80px; max-width: 720px; margin: 0 auto;">
      <form class="glass-card" style="padding: 32px; display:grid; gap: 20px;">
        <input class="input" type="text" placeholder="Votre nom">
        <input class="input" type="email" placeholder="Votre email">
        <input class="input" type="text" placeholder="Sujet">
        <textarea class="input" rows="6" placeholder="Votre message" style="resize:none;"></textarea>
        <button class="btn" type="submit">Envoyer</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__grid">
      <div>
        <div class="site-footer__logo">NEON PULSE</div>
        <p class="site-footer__copyright">© 2026 NEON PULSE AGENCY</p>
      </div>
      <div>
        <h4>Explorer</h4>
        <div class="site-footer__links">
          <a href="#">Confidentialité</a>
          <a href="#">Conditions</a>
        </div>
      </div>
      <div>
        <h4>Réseaux</h4>
        <div class="site-footer__links">
          <a href="#">Discord</a>
          <a href="#">Instagram</a>
          <a href="#">Twitter</a>
        </div>
      </div>
      <div>
        <h4>Newsletter</h4>
        <input type="email" class="input" placeholder="Votre email">
      </div>
    </div>
  </footer>
</body>
</html>
